name: CI
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Detection core
        run: npm ci && npx tsc --noEmit && npx vitest run
      - name: Desktop app builds
        working-directory: desktop
        run: npm ci && npm run typecheck && npm run build

  proofs:
    # Real footage through the real catcher, on ffmpeg 6 (Ubuntu) and ffmpeg 7 (the desktop's bundled build).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pipx && pipx install yt-dlp
      - run: npm ci && (cd desktop && npm ci)
      - run: bash scripts/make-test-footage.sh
      - name: Scanner proofs
        run: |
          for FF in ffmpeg "$PWD/desktop/node_modules/ffmpeg-static/ffmpeg"; do
            echo "== $($FF -version | head -1)"
            for f in test120 test120-silent test20min; do FFMPEG_PATH=$FF npx tsx test/proofs/scan-proof.ts test/fixtures/$f.mp4 | tail -1 | tee -a proofs.jsonl; done
          done
          FFMPEG_PATH=ffmpeg npx tsx test/proofs/scan-proof.ts test/fixtures/test120.mp4 --live | tail -4
          FFMPEG_PATH=ffmpeg npx tsx test/proofs/srt-proof.ts | tail -4
          NO_PROXY=127.0.0.1 FFMPEG_PATH=ffmpeg npx tsx test/proofs/vod-proof.ts | tail -1
          node -e 'const l=require("fs").readFileSync("proofs.jsonl","utf8").trim().split("\n").map(JSON.parse);const bad=l.filter(r=>!r.burstsCovered.every(Boolean)||r.decoyCaught||!r.allOnBursts||r.clipsRealAndAligned===false);if(bad.length){console.error(bad);process.exit(1)}'
      - uses: actions/upload-artifact@v4
        with: { name: proofs, path: proofs.jsonl }

  desktop-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cd desktop && npm ci && npx playwright-core install-deps chromium
      - run: bash scripts/make-test-footage.sh
      - name: Electron end to end (Xvfb)
        working-directory: desktop
        run: npm run build && xvfb-run -a node test/e2e.mjs
        env: { FIXTURES: ../test/fixtures }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: desktop-e2e, path: desktop/test-results }
